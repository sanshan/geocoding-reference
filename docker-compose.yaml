services:
  database:
    image: postgis/postgis:17-3.5
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-geocoding}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - '${DB_PORT:-5432}:5432'

    volumes:
      - geocoding-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  migrations:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.migrations

    restart: "no"

    environment:
      NODE_ENV: development

      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-geocoding}

      DATASET_URL: ${DATASET_URL:-https://download.geonames.org/export/zip/US.zip}

    depends_on:
      database:
        condition: service_healthy

    command:
      - pnpm
      - --filter
      - '@geocoding/api'
      - run
      - migration:run


  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production

      PORT: 3000

      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-geocoding}

      DATASET_URL: ${DATASET_URL}

    ports:
      - '${API_PORT:-3000}:3000'

    depends_on:
      migrations:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    restart: unless-stopped

    ports:
      - '${WEB_PORT:-4200}:80'

    depends_on:
      api:
        condition: service_healthy


volumes:
  geocoding-postgres-data: